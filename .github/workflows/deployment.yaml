name: Deployment

on:
  push:
    branches: [main, feature/deployment]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04   # pinned; ubuntu-latest moves to 26.04 on 2026-10-19
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute backend image tags
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/conduit-backend
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend image
        run: |
          docker build \
            -t "ghcr.io/${{ github.repository_owner }}/conduit-frontend:${{ github.sha }}" \
            -t "ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest" \
            ./frontend
          docker push --all-tags "ghcr.io/${{ github.repository_owner }}/conduit-frontend"

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # pinned; ubuntu-latest moves to 26.04 on 2026-10-19
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: deploy/conduit
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copy the compose file to the VM
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${DEPLOY_PATH}"
          scp -i ~/.ssh/id_deploy docker-compose.yaml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}/docker-compose.yaml"

      - name: Log in to GHCR on the VM
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"

      - name: Pull the images and start the stack
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${DEPLOY_PATH} \
             && export IMAGE_TAG=${{ github.sha }} \
             && docker compose pull \
             && docker compose up -d --no-build"

      - name: Log out from GHCR on the VM
        if: always()
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "docker logout ghcr.io"

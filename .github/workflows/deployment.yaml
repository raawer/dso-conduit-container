name: Deployment

on:
  push:
    branches: [feature/deployment]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push the backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/conduit-backend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/conduit-backend:latest \
            ./backend
          docker push --all-tags ghcr.io/${{ github.repository_owner }}/conduit-backend

      - name: Build and push the frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/conduit-frontend:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/conduit-frontend:latest \
            ./frontend
          docker push --all-tags ghcr.io/${{ github.repository_owner }}/conduit-frontend
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Check the connection
        run: |
          ssh -i ~/.ssh/id_deploy \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "docker compose version"

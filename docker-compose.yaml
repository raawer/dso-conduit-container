services:
  db:
    image: postgres:17
    env_file: ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    platform: linux/amd64
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: always


volumes:
  postgres_data:
